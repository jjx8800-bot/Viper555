<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص انتشار الرقم</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>🔎 فحص انتشار رقم الجوال</h1>

    <p class="subtitle">
      ابحث عن ظهور رقمك في صفحات الإنترنت العامة.
    </p>

    <div class="search-box">
      <input
        id="phone"
        type="tel"
        placeholder="مثال: 9665XXXXXXXX"
        autocomplete="off"
      >

      <button id="searchBtn">بحث</button>
    </div>

    <div id="status"></div>

    <div id="results"></div>

    <div class="footer">
      Viper
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
